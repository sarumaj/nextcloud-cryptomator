---
# The app's PHP and JavaScript must parse, the PHP must follow Nextcloud's coding
# standard (php-cs-fixer), pass Psalm and its PHPUnit tests (tests/php, against
# Nextcloud's public API, no Nextcloud), its info.xml must pass the app store's
# schema, the Markdown must pass markdownlint, the committed build
# (js/cryptomator_vaults-*.mjs) must be what src/ builds, its translations must
# cover the integration, the tests (Node, no Nextcloud and no network:
# tests/vault.test.js, tests/write.test.js, tests/keys.test.js, tests/health.test.js,
# tests/inbox.test.mjs) must pass, and Cryptomator's own library must read what the
# app writes (tests/compat.sh). On a real Nextcloud with PostgreSQL (the oldest and
# the newest supported), the app must install over its release, upgrade and pass
# tests/server/check.sh; the browser test (tests/e2e/check.mjs) must pass on the
# newest.
name: CI
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
"on":
  push:
    branches: [main, "renovate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: docker
    # PHP with git (for the checkout), as in the project's other apps.
    container: docker.io/library/composer:2
    timeout-minutes: 10
    steps:
      - name: Check out
        run: &checkout |
          git init -q . && git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Lint the PHP files
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check info.xml against the app store's schema
        run: |
          apk add -q libxml2-utils
          wget -q -O /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema /tmp/info.xsd app/cryptomator_vaults/appinfo/info.xml

      - name: Install the development tools
        run: composer install -q --no-interaction --no-progress

      - name: Check the PHP follows Nextcloud's coding standard
        run: composer cs:check

      - name: Check the PHP with Psalm
        run: composer psalm

      - name: Run the PHPUnit tests
        run: vendor/bin/phpunit

  javascript:
    runs-on: docker
    container: docker.io/library/node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Check out
        run: *checkout

      - name: Check the JavaScript parses
        run: for f in app/cryptomator_vaults/js/*.js app/cryptomator_vaults/l10n/*.js; do node --check "$f"; done

      # The server installs the app from the repository, without a build of its own.
      - name: Check the committed build is up to date
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- app/cryptomator_vaults/js app/cryptomator_vaults/css \
            || { echo "::error::Run npm run build and commit its output"; exit 1; }
          test -z "$(git status --porcelain -- app/cryptomator_vaults)" \
            || { git status --porcelain -- app/cryptomator_vaults; echo "::error::The build made files that are not committed"; exit 1; }

      - name: Check NOTICE.md lists the build's packages
        run: |
          npm run notice
          git diff --exit-code -- NOTICE.md || { echo "::error::Run npm run notice and commit NOTICE.md"; exit 1; }
          # Its build goes to a folder of its own: the app's must be as committed.
          test -z "$(git status --porcelain -- app/cryptomator_vaults)" \
            || { git status --porcelain -- app/cryptomator_vaults; echo "::error::npm run notice changed the app's folder"; exit 1; }

      - name: Check the Markdown with markdownlint
        run: npx --yes markdownlint-cli2 "*.md" "docs/**/*.md"

      - name: Check the translations are valid and complete
        run: node tests/l10n.js

      - name: Run the tests
        run: node --test tests/vault.test.js tests/write.test.js tests/keys.test.js tests/health.test.js tests/inbox.test.mjs

  # What the app writes, read and checked by Cryptomator's own library (cryptofs):
  # tests/compat.test.js through tests/compat.sh, with Java from the image and Node
  # from its release.
  compat:
    runs-on: docker
    container: docker.io/library/maven:3.9.11-eclipse-temurin-25
    timeout-minutes: 15
    env:
      NODE_VERSION: v24.22.2
    steps:
      - name: Install git and Node
        run: |
          apt-get update -qq && apt-get install -qq -y --no-install-recommends git curl ca-certificates >/dev/null
          curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.gz" | tar -xz -C /opt
          echo "/opt/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Check out
        run: *checkout

      - name: Check what the app writes with Cryptomator's library
        run: tests/compat.sh

  # The app on a real Nextcloud (the shared action nextcloud-app-server of
  # dawid/ci-actions): the app store's release installed and upgraded to the
  # checkout, the checks every app gets, then what people get (tests/server/check.sh).
  server:
    # A whole Ubuntu with rootless Docker, for Nextcloud and PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nextcloud info.xml supports and the newest released (36 has no image yet).
        nextcloud: ["32", "35"]
    steps:
      - name: Check out
        run: *checkout
      - name: Check the app on Nextcloud ${{ matrix.nextcloud }}
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-server@main
        with:
          app-id: cryptomator_vaults
          nextcloud: ${{ matrix.nextcloud }}
          check: tests/server/check.sh
          # Docs or translations alone need no server.
          paths: app/** tests/server/** .forgejo/workflows/ci.yml

  # The browser test (tests/e2e/check.mjs) on the same kind of server, the newest
  # Nextcloud only: it takes minutes (its inboxes' files wait 2 minutes), and the
  # integration relies on how that Files decides what to offer. tests/e2e/run.sh
  # uploads the test vault and runs Playwright's Chromium beside the server.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        run: *checkout
      - name: Run the browser test on Nextcloud 35
        uses: https://git.ciepiela.org/dawid/ci-actions/nextcloud-app-server@main
        with:
          app-id: cryptomator_vaults
          nextcloud: "35"
          check: tests/e2e/run.sh
          # What the browser runs: the app, its sources and build, the test and its vault.
          paths: app/** src/** package.json package-lock.json tests/e2e/** tests/fixtures/** .forgejo/workflows/ci.yml
